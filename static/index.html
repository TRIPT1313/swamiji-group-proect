<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sudoku Solver</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            color: #222;
            text-align: center;
            margin: 0;
            padding: 28px 12px;
        }
        h1 { font-size: 26px; margin-bottom: 8px; }
        p { font-size: 14px; color: #555; }
        #board {
            display: grid;
            grid-template-columns: repeat(9, 1fr);
            width: min(90vw, 378px);
            margin: 22px auto;
            border: 2px solid black;
            background: white;
        }
        #board input {
            min-width: 0;
            width: 100%;
            aspect-ratio: 1;
            box-sizing: border-box;
            border: 1px solid #bbb;
            border-radius: 0;
            background: white;
            text-align: center;
            font-size: 20px;
            outline-offset: -2px;
            padding: 0;
        }
        #board input.box-right { border-right: 2px solid black; }
        #board input.box-bottom { border-bottom: 2px solid black; }
        #board input.given { background: #ececec; font-weight: bold; }
        button {
            padding: 10px 16px;
            margin: 3px;
            font-size: 14px;
            border: 1px solid #999;
            border-radius: 4px;
            background: white;
            cursor: pointer;
        }
        button:hover { background: #e9e9e9; }
        #solveBtn { background: #dbeafe; border-color: #80a7d8; }
        #message { min-height: 20px; margin-top: 16px; color: #333; }
        footer { font-size: 12px; color: #777; margin-top: 24px; }
    </style>
</head>
<body>
    <h1>Sudoku Solver</h1>
    <p>Enter numbers 1 to 9. Leave blank cells empty.</p>

    <div id="board" aria-label="Sudoku grid"></div>

    <button id="solveBtn">Solve Sudoku</button>
    <button id="clearBtn">Clear</button>
    <button id="exampleBtn">Example</button>
    <p id="message" role="status"></p>
    <footer>Python Backtracking Algorithm</footer>

    <script>
        // A sample puzzle. Zero means an empty cell.
        const example = [
            [5,3,0,0,7,0,0,0,0],
            [6,0,0,1,9,5,0,0,0],
            [0,9,8,0,0,0,0,6,0],
            [8,0,0,0,6,0,0,0,3],
            [4,0,0,8,0,3,0,0,1],
            [7,0,0,0,2,0,0,0,6],
            [0,6,0,0,0,0,2,8,0],
            [0,0,0,4,1,9,0,0,5],
            [0,0,0,0,8,0,0,7,9]
        ];

        const board = document.getElementById("board");
        const message = document.getElementById("message");
        const cells = [];

        // Create 81 input boxes.
        for (let row = 0; row < 9; row++) {
            cells[row] = [];
            for (let col = 0; col < 9; col++) {
                const input = document.createElement("input");
                input.type = "text";
                input.maxLength = 1;
                input.inputMode = "numeric";
                input.setAttribute("aria-label", `Row ${row + 1}, column ${col + 1}`);
                if (col === 2 || col === 5) input.classList.add("box-right");
                if (row === 2 || row === 5) input.classList.add("box-bottom");
                input.addEventListener("input", () => {
                    input.value = input.value.replace(/[^1-9]/g, "");
                    input.classList.remove("given");
                    message.textContent = "";
                });
                board.appendChild(input);
                cells[row][col] = input;
            }
        }

        function showBoard(numbers, markGiven = false) {
            for (let row = 0; row < 9; row++) {
                for (let col = 0; col < 9; col++) {
                    const value = numbers[row][col];
                    cells[row][col].value = value === 0 ? "" : value;
                    cells[row][col].classList.toggle("given", markGiven && value !== 0);
                }
            }
        }

        function readBoard() {
            return cells.map(row => row.map(cell => Number(cell.value) || 0));
        }

        document.getElementById("solveBtn").addEventListener("click", async () => {
            message.textContent = "Solving...";
            try {
                const response = await fetch("/solve", {
                    method: "POST",
                    headers: {"Content-Type": "application/json"},
                    body: JSON.stringify({board: readBoard()})
                });
                const data = await response.json();
                if (!response.ok) {
                    message.textContent = data.error;
                    return;
                }
                showBoard(data.solution);
                message.textContent = "Sudoku solved successfully!";
            } catch (error) {
                message.textContent = "Server not running. Start it with python app.py.";
            }
        });

        document.getElementById("clearBtn").addEventListener("click", () => {
            showBoard(Array.from({length: 9}, () => Array(9).fill(0)));
            message.textContent = "Board cleared.";
        });

        document.getElementById("exampleBtn").addEventListener("click", () => {
            showBoard(example, true);
            message.textContent = "Example puzzle loaded.";
        });

        showBoard(example, true);
    </script>
</body>
</html>
